<line x1="180" y1="12" x2="180" y2="345" class="div"/>
<path d="M300,104 C300,44 80,44 80,103" class="e" marker-end="url(#a)"/>
<path d="M106,130 H272" class="e" marker-end="url(#a)"/>
<path d="M80,244 C80,180 190,150 275,142" class="e" marker-end="url(#a)"/>
<path d="M300,156 C300,240 200,270 108,270" class="e" marker-end="url(#a)"/>
<path d="M326,130 H472" class="e" marker-end="url(#a)"/>
